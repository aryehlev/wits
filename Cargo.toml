[package]
name = "wits"
version = "2.2.2"
edition = "2021"
rust-version = "1.88"
description = "Explain why a process is slow, and where in its code: Linux (procfs, eBPF) and macOS, any language, one binary."
license = "MIT"
repository = "https://github.com/aryehlev/wits"
readme = "README.md"
keywords = ["performance", "profiler", "ebpf", "debugging", "cli"]
categories = ["command-line-utilities", "development-tools::profiling"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
blazesym = { version = "0.2", default-features = false, features = ["demangle", "dwarf", "zlib"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/wits-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/wits-x86_64-unknown-linux-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/wits-aarch64-unknown-linux-musl.tar.gz"
