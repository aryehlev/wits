<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wits</title>
<style>
:root {
  --bg: #f5f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --surface-3: #e4e7ef;
  --fg: #14161b; --muted: #5d6474; --faint: #8b92a1; --line: #e3e6ee; --line-2: #cfd4e0;
  --accent: #5b55f0; --accent-soft: #eceaff; --good: #11966a; --good-soft: #e1f5ec; --bad: #d4462f; --bad-soft: #fdeae6;
  --shadow: 0 1px 2px rgba(20, 22, 40, .05), 0 6px 20px rgba(20, 22, 40, .06);
  --tip: #15171d; --tipfg: #f3f4f8; --flame-l: 72; --flame-text: #15171d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f14; --surface: #151820; --surface-2: #1b1f29; --surface-3: #272c38;
    --fg: #e9ebf1; --muted: #9ba3b3; --faint: #6e7688; --line: #252a35; --line-2: #343a48;
    --accent: #9590ff; --accent-soft: #24223f; --good: #3dd095; --good-soft: #10291f; --bad: #ff7b65; --bad-soft: #35191a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 28px rgba(0, 0, 0, .28);
    --tip: #f1f2f6; --tipfg: #12141a; --flame-l: 44; --flame-text: #f7f8fb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f14; --surface: #151820; --surface-2: #1b1f29; --surface-3: #272c38;
  --fg: #e9ebf1; --muted: #9ba3b3; --faint: #6e7688; --line: #252a35; --line-2: #343a48;
  --accent: #9590ff; --accent-soft: #24223f; --good: #3dd095; --good-soft: #10291f; --bad: #ff7b65; --bad-soft: #35191a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 28px rgba(0, 0, 0, .28);
  --tip: #f1f2f6; --tipfg: #12141a; --flame-l: 44; --flame-text: #f7f8fb;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.mono, code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.wrap { max-width: 1260px; margin: 0 auto; padding: 16px 16px 56px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 34px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.brand svg { width: 22px; height: 22px; }
.kindtag { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 2px 10px; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer; transition: transform .12s, border-color .12s, background .12s; white-space: nowrap; }
.btn:hover { border-color: var(--line-2); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn svg { width: 15px; height: 15px; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px 20px; }
.card + .card, .row + .card, .card + .row { margin-top: 14px; }
.card h2 { flex-wrap: wrap; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.card h2 .sub { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); }
.row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }

/* hero */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 26px; align-items: center; }
.donut { position: relative; flex: none; }
.donut svg { display: block; overflow: visible; }
.donut .seg { cursor: pointer; transition: stroke-dasharray 1s cubic-bezier(.2, .8, .2, 1), stroke-width .15s; }
.donut .seg:hover { stroke-width: 22; }
.donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
.donut .big { font-size: 30px; font-weight: 760; letter-spacing: -.02em; line-height: 1.05; }
.donut .lbl { font-size: 12px; color: var(--muted); margin-top: 3px; }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; color: var(--muted); font-size: 13px; }
.who b { color: var(--fg); font-size: 14px; }
.headline { font-size: 26px; line-height: 1.22; margin: 6px 0 4px; letter-spacing: -.02em; font-weight: 720; }
.subline { color: var(--muted); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip b { color: var(--fg); font-weight: 600; }
.chip.good { background: var(--good-soft); color: var(--good); } .chip.bad { background: var(--bad-soft); color: var(--bad); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.pill { --c: var(--accent); display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; transition: transform .12s, background .15s, border-color .15s; }
.pill:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--c) 50%, var(--line)); }
.pill[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 14%, var(--surface)); border-color: color-mix(in srgb, var(--c) 60%, transparent); font-weight: 600; }
.pill[aria-pressed="false"] { color: var(--muted); }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.pill[aria-pressed="false"] .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.pill .t { color: var(--muted); font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

/* fix-here cards */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 12px; }
.hot { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; transition: transform .15s, border-color .15s, background .15s; position: relative; overflow: hidden; }
.hot + .hot { margin-top: 8px; }
.hot:hover { transform: translateY(-1px); border-color: var(--line-2); background: var(--surface-2); }
.hot .rank { grid-row: span 3; width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 13px; }
.hot .fname { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 650; font-size: 14px; overflow-wrap: anywhere; }
.hot .loc { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.hot .chain { font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
.hot .share { position: absolute; left: 0; bottom: 0; height: 3px; border-radius: 0 3px 0 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.hot .pc { position: absolute; right: 12px; top: 10px; font-weight: 720; font-size: 15px; }
.copy { border: 0; background: var(--surface-2); border-radius: 6px; padding: 1px 7px; cursor: pointer; font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.copy:hover { background: var(--surface-3); color: var(--fg); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.app { background: var(--accent-soft); color: var(--accent); }

/* advice */
.advice p { margin: 0 0 8px; }
.advice .try { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin: 10px 0 12px; }
.advice .try b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.facts dt { color: var(--muted); font-size: 13px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.up { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin-top: 10px; }
.notes { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
details.more { margin-top: 14px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 13px; }

/* explorer */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 13px; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); font-weight: 600; }
.switch { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: 13px; user-select: none; border: 0; background: transparent; padding: 4px 2px; }
.switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--surface-3); position: relative; transition: background .2s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
.switch[aria-checked="true"] .track { background: var(--accent); }
.switch[aria-checked="true"] .track::after { transform: translateX(14px); }
.search { position: relative; flex: 1 1 180px; max-width: 300px; }
.search input { width: 100%; padding: 7px 10px 7px 30px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 13px; }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--faint); }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; min-height: 0; }
.filters:empty { display: none; }
.ftag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 4px 3px 10px; }
.ftag button { border: 0; background: transparent; color: inherit; cursor: pointer; border-radius: 50%; width: 18px; height: 18px; line-height: 16px; padding: 0; }
.ftag button:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
.ex { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 14px; align-items: start; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 12.5px; margin-bottom: 6px; min-height: 24px; }
.crumbs button { border: 0; background: transparent; padding: 2px 6px; border-radius: 6px; cursor: pointer; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs button:hover { background: var(--surface-2); color: var(--fg); }
.crumbs button:last-child { color: var(--fg); font-weight: 600; }
.crumbs .sep { color: var(--faint); }
.fscroll { max-height: 600px; overflow: auto; border-radius: 12px; background: var(--surface-2); padding: 4px; }
.flame { position: relative; min-height: 60px; }
.fn { position: absolute; height: 22px; line-height: 22px; padding: 0 7px; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--flame-text); border-radius: 4px; cursor: pointer;
  transition: left .42s cubic-bezier(.2, .8, .2, 1), width .42s cubic-bezier(.2, .8, .2, 1), top .42s cubic-bezier(.2, .8, .2, 1), opacity .25s, filter .12s, box-shadow .12s; animation: fadein .35s ease; }
.fn:hover { filter: brightness(1.1) saturate(1.15); z-index: 1; }
.fn.dim { opacity: .22; }
.fn.hit { box-shadow: inset 0 0 0 2px var(--fg); opacity: 1; }
.fn.same { box-shadow: inset 0 0 0 1.5px var(--fg); }
.fn.sel { box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); z-index: 2; }
.fn.coll { font-style: italic; }
.fn.outside { background-image: repeating-linear-gradient(135deg, transparent 0 7px, rgba(255, 255, 255, .13) 7px 14px); }
.fn.gone { opacity: 0 !important; pointer-events: none; }
@keyframes fadein { from { opacity: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; font-size: 12px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 3px 8px; cursor: pointer; color: var(--muted); }
.legend button:hover { background: var(--surface-2); color: var(--fg); }
.legend button[aria-pressed="true"] { border-color: var(--line-2); color: var(--fg); background: var(--surface-2); }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.hintline { font-size: 12px; color: var(--faint); margin-top: 6px; }
.matchinfo { font-size: 12px; color: var(--muted); }

/* tables */
.tscroll { overflow: auto; max-height: 600px; border-radius: 12px; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; background: var(--surface); text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); padding: 8px 12px; white-space: nowrap; z-index: 1; }
th.sort { cursor: pointer; user-select: none; } th.sort:hover { color: var(--fg); }
td { border-bottom: 1px solid var(--line); padding: 7px 12px; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.sel td { background: var(--accent-soft); }
.cellbar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.cellbar .b { width: 70px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; flex: none; }
.cellbar .b i { display: block; height: 100%; border-radius: 3px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.fcell { display: flex; flex-direction: column; min-width: 0; }
.fcell .nm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 520px; }
.fcell .sm { font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 520px; }

/* packages */
.stackbar { display: flex; height: 34px; border-radius: 10px; overflow: hidden; gap: 2px; margin-bottom: 12px; }
.stackbar button { border: 0; padding: 0 8px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; transition: flex-grow .6s cubic-bezier(.2, .8, .2, 1), filter .12s; text-align: left; min-width: 3px; }
.stackbar button:hover { filter: brightness(1.12); }

/* side panel */
.side { position: sticky; top: 12px; background: var(--surface-2); border-radius: 14px; padding: 14px; min-height: 200px; font-size: 13px; }
.side h3 { margin: 0 0 2px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; overflow-wrap: anywhere; }
.side .full { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--faint); overflow-wrap: anywhere; margin-bottom: 8px; }
.side .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.side .stat div { background: var(--surface); border-radius: 10px; padding: 8px 10px; }
.side .stat b { display: block; font-size: 18px; letter-spacing: -.01em; }
.side .stat span { font-size: 11.5px; color: var(--muted); }
.side h4 { margin: 14px 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.side ul { list-style: none; margin: 0; padding: 0; }
.side li button { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 4px 6px; border-radius: 7px; cursor: pointer; text-align: left; }
.side li button:hover { background: var(--surface); }
.side li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.side li .p { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.side .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.minibar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--surface-3); margin: 6px 0 2px; }
.minibar i { display: block; height: 100%; }

/* lists: pods, processes, diff */
.list { display: flex; flex-direction: column; gap: 6px; }
.item { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(120px, 1fr) minmax(0, 2fr); gap: 14px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; transition: background .12s, border-color .12s, transform .12s; text-align: left; background: var(--surface); width: 100%; }
.item:hover { background: var(--surface-2); transform: translateY(-1px); }
.item[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.item .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sm { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .why { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-3); }
.sbar i { display: block; height: 100%; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.nested { margin-top: 14px; animation: rise .35s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.verdict-ico { width: 132px; height: 132px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.verdict-ico svg { width: 56px; height: 56px; }
.dv { display: grid; grid-template-columns: 1fr 1fr; align-items: center; height: 16px; }
.dv .l { display: flex; justify-content: flex-end; } .dv .r { display: flex; }
.dv span { white-space: nowrap; }
.dv i { display: block; height: 10px; border-radius: 3px; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.twin { display: flex; flex-direction: column; gap: 3px; min-width: 120px; }
.twin i { display: block; height: 7px; border-radius: 3px; transition: width .8s cubic-bezier(.2, .8, .2, 1); }

/* waiting, toast, tooltip */
.waiting { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 60px 16px; text-align: center; color: var(--muted); }
.radar { width: 74px; height: 74px; border-radius: 50%; position: relative; background: radial-gradient(circle, var(--accent) 0 7px, transparent 8px); }
.radar::before, .radar::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: ping 1.8s cubic-bezier(.2, .6, .4, 1) infinite; opacity: 0; }
.radar::after { animation-delay: .9s; }
@keyframes ping { 0% { transform: scale(.2); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }
.progress { width: min(320px, 80%); height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--tip); color: var(--tipfg); padding: 9px 16px; border-radius: 12px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .25s; pointer-events: none; z-index: 20; box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.tip { position: fixed; pointer-events: none; background: var(--tip); color: var(--tipfg); border-radius: 10px; padding: 9px 11px; font-size: 12px; max-width: 440px; z-index: 30; display: none; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); line-height: 1.45; }
.tip .t1 { font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
.tip .t2 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; opacity: .7; overflow-wrap: anywhere; margin-top: 2px; }
.tip .t3 { opacity: .85; margin-top: 4px; }
.tip .tb { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 0 6px; margin-right: 4px; background: rgba(127, 127, 127, .25); }

    el("div", { class: "verdict-ico", style: `background:${soft};color:${col}`, html: ICON[good ? "down" : bad ? "up" : "same"] }),
    el("div", { style: "min-width:0" },
      el("div", { class: "who" }, "wits diff"),
      el("div", { class: "headline", style: `color:${col}` }, good ? "Faster" : bad ? "Slower" : "No clear change"),
      el("div", { style: "display:flex;align-items:baseline;gap:16px;flex-wrap:wrap" }, big, el("div", { class: "subline" }, `${msec(w.before)} → ${msec(w.after)}`)),
      el("div", { class: "subline", style: "margin-top:4px" }, d.noise || ""),
      el("div", { class: "actions" }, el("button", { class: "btn primary", onclick: () => askAgent(diffPrompt(d)) }, icon("spark"), host.on ? "Tell the agent" : "Copy a summary for your agent")))));
  const ccard = el("div", { class: "card" }, el("h2", {}, "Time by cause", el("span", { class: "sub" }, "grey is before; click a cause to filter the functions")),
    el("div", { class: "list" }, causes.map(c => {
      const dlt = c.after - c.before;
      const b1 = el("i", { style: "width:0;background:var(--line-2)" }), b2 = el("i", { style: `width:0;background:${causeColor(c.cause)}` });
      requestAnimationFrame(() => requestAnimationFrame(() => { b1.style.width = c.before / max * 100 + "%"; b2.style.width = c.after / max * 100 + "%"; }));
      const it = listItem(st.cause === c.cause,
        el("div", {}, el("div", { class: "nm" }, el("span", { style: `color:${causeColor(c.cause)}` }, "● "), NAME[c.cause] || c.cause), el("div", { class: "sm" }, `${secs(c.before)} → ${secs(c.after)}`)),
        el("div", { class: "twin" }, b1, b2),
        el("div", { style: `font-weight:650;color:${Math.abs(dlt) < 1e-6 ? "var(--muted)" : dlt < 0 ? "var(--good)" : "var(--bad)"}` }, (dlt >= 0 ? "+" : "−") + secs(Math.abs(dlt))),
        () => { st.cause = st.cause === c.cause ? null : c.cause; [...it.parentNode.children].forEach(x => x.setAttribute("aria-selected", "false")); it.setAttribute("aria-selected", String(st.cause === c.cause)); drawFuncs(); });
      return it;
    })));
  const fcard = funcs.length ? el("div", { class: "card" }, el("h2", {}, "Functions that changed most", el("span", { class: "sub" }, "green got faster, red got slower")),
    el("div", { class: "toolbar" }, el("label", { class: "search" }, el("span", { html: ICON.search }), el("input", { type: "search", placeholder: "Search functions", oninput: e => { st.q = e.target.value.trim().toLowerCase(); drawFuncs(); } }))),
    fbox) : null;
  if (good && motion) setTimeout(confetti, 350);
  return [header("diff", d), hero, ccard, fcard, (d.notes || []).length ? el("div", { class: "card" }, el("ul", { class: "notes", style: "margin:0" }, d.notes.map(n => el("li", {}, n)))) : null];
}
function diffPrompt(d) {
  const w = d.wall_ms || {};
  const f = (d.functions || []).slice(0, 5).map(x => `- ${x.func}: ${secs(x.before)} → ${secs(x.after)} (${x.cause})`);
  return [`wits diff: ${d.verdict}, ${msec(w.before)} → ${msec(w.after)}${w.change != null ? ` (${Math.round(w.change * 100)}%)` : ""}. ${d.noise || ""}`,
    f.length ? "Functions that changed most:\n" + f.join("\n") : "",
    d.verdict === "slower" ? "Find what made it slower and fix it." : d.verdict === "faster" ? "Report this result as measured." : "The change made no measurable difference; do not call it a speedup."].filter(Boolean).join("\n");
}
function confetti() {
  const c = el("canvas", { class: "confetti" }); document.body.append(c);
  const ctx = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#3dd095", "#5b55f0", "#f5a524", "#ff6b8b", "#2f9bff"];
  const ps = Array.from({ length: 110 }, () => ({ x: W / 2 + (Math.random() - .5) * 160, y: H * .32, vx: (Math.random() - .5) * 13, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 3, c: cols[Math.random() * cols.length | 0], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, W, H);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += .38; p.vx *= .99; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if (t - t0 < 1900) requestAnimationFrame(f); else c.remove();
  })(t0);
}

function overviewView(o) {
  const rows = o.processes || [];
  const detail = el("div", { class: "nested" });
  const list = el("div", { class: "list" });
  let sel = -1;
  function draw() {
    put(list, ...rows.map((r, i) => {
      const a = r.answer;
      return listItem(i === sel,
        el("div", { style: "min-width:0" }, el("div", { class: "nm" }, r.name), el("div", { class: "sm" }, `pid ${r.pid}${a?.pod ? " · " + a.pod : ""}`)),
        el("div", {}, a ? stackBar(a.breakdown) : null, el("div", { class: "sm", style: "margin-top:4px" }, `waiting ${pct(r.waiting)}` + (a?.cause ? ` · ${NAME[a.cause]}` : ""))),
        el("div", { class: "why" }, a ? (a.cause ? a.what || a.summary : a.summary) : "exited before wits could look"),
        () => { sel = sel === i ? -1 : i; draw(); });
    }));
    const r = rows[sel];
    put(detail, ...(r?.answer ? [answerPage(r.answer)] : []));
    if (r?.answer && !r.answer.flame && host.on) detail.prepend(el("div", { class: "actions", style: "margin:0 0 12px" },
      el("button", { class: "btn", onclick: () => lookAt(r.pid, r.name) }, icon("zoom"), "Profile it")));
  }
  draw();
  return [header("overview", o),
    el("div", { class: "card" },
      el("div", { class: "headline", style: "margin-top:0" }, rows.length ? "What is waiting right now" : "Nothing is waiting or working hard"),
      el("p", { class: "muted", style: "margin:4px 0 14px" }, rows.length ? "The processes that spent most of the last moments waiting. Click one for its answer." : ""),
      list),
    detail];
}

function waiting(text, seconds) {
  const bar = el("i", {});
  put(app, el("div", { class: "waiting" }, el("div", { class: "radar" }), el("div", { style: "font-size:15px" }, text), seconds ? el("div", { class: "progress" }, bar) : null));
  if (seconds) requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${seconds}s linear`; bar.style.width = "100%"; }));
}

function render(d) {
  hideTip();
  activeEx = null;
  if (!d || typeof d !== "object") { put(app, el("p", { class: "empty" }, "wits returned nothing to show.")); return; }
  let v;
  try {
    if (d.kind === "group") v = groupView(d);
    else if (d.kind === "run") v = runView(d);
    else if (d.kind === "diff") v = diffView(d);
    else if (Array.isArray(d.processes) && d.pid == null) v = overviewView(d);
    else if (d.pid != null) v = answerView(d);
    else v = [header("data"), el("pre", { class: "mono card" }, JSON.stringify(d, null, 2))];
  } catch (e) {
    v = [header("error"), el("div", { class: "card" }, el("p", {}, "This page could not draw the result: " + e.message), el("pre", { class: "mono", style: "white-space:pre-wrap" }, JSON.stringify(d, null, 2).slice(0, 4000)))];
    console.error(e);
  }
  put(app, ...[v].flat(), el("div", { class: "foot" }, "wits · why is it slow, and where in the code"));
  document.title = "wits: " + (d.summary || (d.verdict ? "diff: " + d.verdict : "") || (d.command || []).join(" ") || "profile");
}

// ---------------------------------------------------------------- start: embedded data, or an MCP host
try { const t = localStorage.getItem("wits-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (_) {}
const raw = document.getElementById("wits-data").textContent.trim();
if (raw && raw !== "__WITS_" + "DATA__") {
  try { show(JSON.parse(raw), false); } catch (e) { put(app, el("p", { class: "empty" }, "Could not read the data: " + e)); }
} else if (window.parent !== window) {
  host.on = true;
  let next = 1;
  const pending = new Map();
  const post = m => window.parent.postMessage(m, "*");
  host.request = (method, params) => new Promise(ok => { const id = next++; pending.set(id, ok); post({ jsonrpc: "2.0", id, method, params }); });
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params });
  const theme = ctx => { if (ctx?.theme === "dark" || ctx?.theme === "light") { document.documentElement.dataset.theme = ctx.theme; window.dispatchEvent(new Event("wits-theme")); } };
  addEventListener("message", ev => {
    if (ev.source !== window.parent) return;
    const m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && !m.method && pending.has(m.id)) { pending.get(m.id)(m); pending.delete(m.id); return; }
    switch (m.method) {
      case "ui/notifications/tool-input": {
        host.args = m.params?.arguments || null;
        const a = host.args || {};
        const what = a.command ? (Array.isArray(a.command) ? a.command.join(" ") : a.command) : a.target || (a.targets || []).join(", ") || "the system";
        waiting(a.command ? `Running ${what}…` : `Watching ${what}…`, a.command ? 0 : (a.seconds || 2));
        break;
      }
      case "ui/notifications/tool-result": {
        const r = m.params || {};
        let d = r.structuredContent;
        if (!d) { try { d = JSON.parse((r.content || []).find(c => c.type === "text")?.text || ""); } catch (_) {} }
        if (r.isError && !d) put(app, header("error"), el("div", { class: "card" }, el("pre", { class: "mono", style: "white-space:pre-wrap;margin:0" }, (r.content || []).map(c => c.text).join("\n"))));
        else show(d, false);
        break;
      }
      case "ui/notifications/host-context-changed": theme(m.params); break;
      case "ui/resource-teardown": if (m.id != null) post({ jsonrpc: "2.0", id: m.id, result: {} }); break;
      default: if (m.id != null) post({ jsonrpc: "2.0", id: m.id, error: { code: -32601, message: "not supported" } });
    }
  });
  host.request("ui/initialize", { appInfo: { name: "wits", version: "2" }, appCapabilities: {}, protocolVersion: "2026-01-26" })
    .then(r => { host.caps = r.result?.hostCapabilities || {}; host.ctx = r.result?.hostContext || {}; theme(host.ctx); notify("ui/notifications/initialized", {}); });
  new ResizeObserver(() => notify("ui/notifications/size-changed", {
    width: Math.ceil(document.documentElement.scrollWidth), height: Math.ceil(document.documentElement.scrollHeight)
  })).observe(document.body);
}
</script>
