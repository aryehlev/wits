name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo test
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cases/run.sh target/${{ matrix.target }}/release/wits
      - name: package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/wits LICENSE README.md dist/
          tar -C dist -czf wits-${{ matrix.target }}.tar.gz wits LICENSE README.md
          sha256sum wits-${{ matrix.target }}.tar.gz > wits-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: wits-${{ matrix.target }}.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: fill in the Homebrew formula and the AUR PKGBUILD
        run: |
          V=${GITHUB_REF_NAME#v}
          X=$(cut -d' ' -f1 wits-x86_64-unknown-linux-musl.tar.gz.sha256)
          A=$(cut -d' ' -f1 wits-aarch64-unknown-linux-musl.tar.gz.sha256)
          for f in packaging/homebrew/wits.rb packaging/aur/PKGBUILD; do
            sed -e "s/@VERSION@/$V/g" -e "s/@SHA_X86_64@/$X/g" -e "s/@SHA_AARCH64@/$A/g" "$f" > "$(basename "$f")"
          done
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "wits ${GITHUB_REF_NAME#v}" --generate-notes wits-*.tar.gz wits-*.sha256 wits.rb PKGBUILD
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
